spring.application.name=tableturn
server.port=8080

# XAMPP MySQL (default: user root, empty password, port 3306). Database is auto-created.
spring.datasource.url=jdbc:mysql://localhost:3306/tableturn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
